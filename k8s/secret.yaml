# Senha do usuario da aplicacao (stock_app). Vem do secret
# STOCK_DB_APP_PASSWORD do repositorio, aplicado pelo pipeline via envsubst;
# o valor nunca fica versionado.
apiVersion: v1
kind: Secret
metadata:
  name: mechanical-hub-stock-secrets
  namespace: production
  labels:
    app: mechanical-hub-stock
    app.kubernetes.io/name: stock

type: Opaque
stringData:
  database-password: "${DB_PASSWORD}"

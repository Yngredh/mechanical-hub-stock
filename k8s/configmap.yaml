# Configuracao nao sensivel do stock. Os ${...} sao preenchidos pelo pipeline
# (envsubst) com os outputs do mechanical-hub-infra e do mechanical-hub-database.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mechanical-hub-stock-config
  namespace: production
  labels:
    app: mechanical-hub-stock
    app.kubernetes.io/name: stock

data:
  # Banco: output `databases["stock"]` do mechanical-hub-database.
  DB_URL: "jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}"
  DB_USER: "${DB_USERNAME}"

  # Filas: outputs `sqs_queue_urls` e `sqs_dlq_urls` do mechanical-hub-infra.
  # Sem chave de acesso: os pods usam a LabRole dos nos (metadados da instancia).
  AWS_REGION: us-east-1
  STOCK_COMMANDS_QUEUE_URL: "${STOCK_COMMANDS_QUEUE_URL}"
  STOCK_COMMANDS_DLQ_URL: "${STOCK_COMMANDS_DLQ_URL}"
  ORCHESTRATOR_EVENTS_QUEUE_URL: "${ORCHESTRATOR_EVENTS_QUEUE_URL}"

  ENVIRONMENT: production

  # Agente OpenTelemetry. Sem coletor no ambiente, o pipeline grava
  # OTEL_TRACES_EXPORTER=none: o contexto continua sendo propagado pelo SQS
  # e o trace_id segue nos logs, so nao e exportado.
  OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT}"
  OTEL_TRACES_EXPORTER: "${OTEL_TRACES_EXPORTER}"
  OTEL_RESOURCE_ATTRIBUTES: deployment.environment=production
